name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every file combination scripts/lab.sh and the README use must still resolve.
      - name: Compose files resolve
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lab.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.kafka-secure.yml config --quiet

      - name: Postman collections are valid JSON
        run: |
          for f in postman/*.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
