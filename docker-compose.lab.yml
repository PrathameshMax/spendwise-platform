# =============================================================================
# Production Debugging Lab overlay — run the stack the way production runs it.
#
#   ./scripts/lab.sh start        (= docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d)
#
# What this overlay changes, and why:
#
# 1. SPRING_PROFILES_ACTIVE=prod,lab for every business service. The default
#    "dev" profile logs com.spendwise at DEBUG and prints every SQL statement;
#    production runs root=WARN, com.spendwise=INFO (config-repo/*-prod.yml).
#    Every business service also gets "lab": config-repo/application-lab.yml
#    turns on latency histograms, Tomcat thread metrics and the threaddump
#    endpoint, and on transaction-service it switches on the /lab/seed
#    test-data endpoints. config-server and discovery-server keep their own
#    profiles (config-server must stay "native").
#
# 2. JSON logs. LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs makes Spring Boot write
#    one Elastic Common Schema JSON object per line to stdout: log.level,
#    service.name, log.logger, message, the MDC values correlationId, traceId,
#    spanId, and error.type/error.message/error.stack_trace on exceptions
#    (the stack trace stays inside the event instead of spilling over many
#    lines). Kibana and Splunk index those fields directly.
#    IntelliJ runs are unaffected and keep the readable text pattern.
#
# 3. Docker's json-file log driver records each container's compose service
#    and project name next to every line ("attrs"), so the log shipper
#    (infra/elk) can label Postgres, Kafka and Redis lines too, and ignore
#    containers that are not part of SpendWise.
#
# 4. Prometheus loads the lab alert rules (infra/prometheus/alerts-lab.yml).
#
# 5. keycloak-lab-customers (infra/keycloak-lab/lab-customers.sh): one-shot
#    job that creates the lab customers lab-customer-0001..N in the spendwise
#    realm (password LabCustomer#2026, role CUSTOMER) with fixed ids that match
#    the /lab/seed test data, so their tokens see their own seeded history.
#    Idempotent: existing users are skipped. It runs on every lab start
#    because start-dev Keycloak loses users when its container is recreated.
#    Same script runs unchanged as a Kubernetes Job (KEYCLOAK_URL from env).
#
# 6. traffic-simulator (k6, infra/traffic/mobile-app.js): steady mobile-app
#    traffic through api-gateway, each virtual user logged in as one lab
#    customer with a real Keycloak token. Opt-in through the "traffic"
#    profile: ./scripts/lab.sh traffic-start / traffic-stop. Its own output
#    carries no compose labels, so it is not shipped to Kibana or Splunk.
#    TARGET / TOKEN_URL are plain env vars, so the same script can later be
#    pointed at an AWS load balancer or Route 53 name.
#
# 7. merchant-directory (infra/partners/merchant_directory.py): stand-in for
#    an external partner API, reachable at http://merchant-directory:8099 on
#    the compose network. Like a real vendor it is outside the platform: no
#    compose log labels (not shipped), no metrics, no host port.
#
# Without this overlay, `docker compose up -d` behaves exactly as before.
# =============================================================================

x-lab-logging: &lab-logging
  driver: json-file
  options:
    labels: "com.docker.compose.service,com.docker.compose.project"

x-json-logs: &json-logs
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: lab

services:
  zipkin:
    logging: *lab-logging
  postgres:
    logging: *lab-logging
  postgres-db-init:
    logging: *lab-logging
  kafka-1:
    logging: *lab-logging
  kafka-2:
    logging: *lab-logging
  kafka-3:
    logging: *lab-logging
  kafka-ui:
    logging: *lab-logging
  schema-registry:
    logging: *lab-logging
    environment:
      # Its own health check (GET /subjects every 10s) produces two INFO lines
      # each time: a request-log line and "Forwarded for header ...". WARN
      # keeps real problems and drops that noise.
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
  redis:
    logging: *lab-logging
  prometheus:
    logging: *lab-logging
    volumes:
      - ./infra/prometheus/alerts-lab.yml:/etc/prometheus/alerts-lab.yml
  grafana:
    logging: *lab-logging

  discovery-server:
    logging: *lab-logging
    environment:
      <<: *json-logs

  config-server:
    logging: *lab-logging
    environment:
      <<: *json-logs
      # config-server logs an INFO line ("Adding property source ...") for every
      # property file each time a client fetches configuration: in the first
      # Kibana run that was several identical lines a minute, burying real
      # events and burning Splunk's 500 MB/day licence. Production teams tune
      # this logger to WARN. Env var logger names are lower-cased by Spring,
      # so the level is set on the package rather than the class.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_CONFIG_SERVER_ENVIRONMENT: WARN

  user-service:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  transaction-service:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  budget-service:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  notification-service:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  analytics-service:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  api-gateway:
    logging: *lab-logging
    environment:
      <<: *json-logs
      SPRING_PROFILES_ACTIVE: prod,lab

  keycloak-lab-customers:
    image: curlimages/curl:8.11.1
    container_name: spendwise-keycloak-lab-customers
    entrypoint: ["sh", "/keycloak-lab/lab-customers.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: spendwise
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      LAB_CUSTOMERS: ${LAB_CUSTOMERS:-50}
      LAB_CUSTOMER_PASSWORD: ${LAB_CUSTOMER_PASSWORD:-LabCustomer#2026}
    volumes:
      - ./infra/keycloak-lab:/keycloak-lab:ro
    depends_on:
      keycloak:
        condition: service_healthy
    logging: *lab-logging
    restart: "no"

  traffic-simulator:
    image: grafana/k6:0.54.0
    container_name: spendwise-traffic-simulator
    profiles: ["traffic"]
    command: ["run", "/scripts/mobile-app.js"]
    environment:
      TARGET: http://api-gateway:8080
      TOKEN_URL: http://keycloak:8080/realms/spendwise/protocol/openid-connect/token
      # Must not exceed LAB_CUSTOMERS (the customers that exist in Keycloak).
      LAB_USERS: ${LAB_USERS:-50}
      LAB_CUSTOMER_PASSWORD: ${LAB_CUSTOMER_PASSWORD:-LabCustomer#2026}
      HOME_SCREEN_PER_MIN: ${HOME_SCREEN_PER_MIN:-90}
      STATEMENT_PER_MIN: ${STATEMENT_PER_MIN:-120}
    volumes:
      - ./infra/traffic:/scripts:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak-lab-customers:
        condition: service_completed_successfully
    restart: "no"

  merchant-directory:
    image: python:3.12.7-alpine
    container_name: spendwise-merchant-directory
    command: ["python", "-u", "/partners/merchant_directory.py"]
    environment:
      PORT: "8099"
    volumes:
      - ./infra/partners:/partners:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped
